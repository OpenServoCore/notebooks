key = "awake_step_counts.3v7"
decimals = 2
bounds = "statistical, one standard error over the coasts"
confidence = "measured on 96 coasts of mg90-c, per-spin sd 0.5 counts, mg90-b within 0.3"

[[constant]]
label = "Awake zero over the asleep zero, 5 V"
experiment = "compensation"
key = "awake_step_counts.5v0"
decimals = 2
bounds = "statistical, one standard error over the coasts"
confidence = "measured on 156 coasts of mg90-c, per-spin sd 0.5 counts, mg90-b 0.3 above"

[[constant]]
label = "Awake zero over the asleep zero, 7.4 V"
experiment = "compensation"
key = "awake_step_counts.7v4"
decimals = 2
