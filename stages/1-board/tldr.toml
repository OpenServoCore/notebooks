# The constants table of this stage's TL;DR. The hand-written parts live here,
# the numbers come from each experiment's results file. After a change to
# either, run `uv run python -m oscnb.tldr` to rewrite the README's table.

pair = "dev-v006-2A-D"

[[constant]]
label = "Tap A floor at rest"
experiment = "rest-noise"
key = "tap_a_noise"
decimals = 2
bounds = "range, lowest to highest of the nine streams"
confidence = "measured, at the ADC's quantization"

[[constant]]
label = "Tap B floor at rest"
experiment = "rest-noise"
key = "tap_b_noise"
decimals = 2
bounds = "range, lowest to highest of the nine streams"
confidence = "measured, at the ADC's quantization"

[[constant]]
label = "Current scale"
experiment = "current-scale"
key = "counts_per_a"
decimals = 1
bounds = "statistical, one standard error of the line"
confidence = "measured from 3.7 V up, the bounds are not its accuracy, see the next row"

[[constant]]
label = "Current scale, absolute uncertainty"
experiment = "current-scale"
key = "counts_per_a_class_pct"
unit = "% of reading"
scale = 1.0
decimals = 0
confidence = "class, the DMM's 20 A jack, so no spread to give as bounds"

[[constant]]
label = "In-drive offset over the torque-off zero"
experiment = "current-scale"
key = "drive_offset_counts"
decimals = 1
signed = true
bounds = "statistical, one standard error of the line"
confidence = "measured, most likely the driver's own current through the shunt"

[[constant]]
label = "Current range graded"
experiment = "current-scale"
key = "amps_range"
decimals = 2
bounds = "range, lowest to highest lap current"
confidence = "the scale is not graded outside it"

[[constant]]
label = "Rest zero, torque-off"
experiment = "current-scale"
key = "rest_zero_counts"
decimals = 0
bounds = "range, lowest to highest lap rest from 3.7 V up"
confidence = "measured, it follows VDD, so each drive takes its own"

[[constant]]
label = "Current at a 3.3 V rail over the line, bare load"
experiment = "current-scale"
key = "deviation_3v3_bare_pct"
decimals = 1
signed = true
confidence = "not graded, one level with the regulator in dropout, no spread"

[[constant]]
label = "Terminal difference scale"
experiment = "terminal-chain"
key = "terminal_counts_per_v"
decimals = 2
bounds = "statistical, one standard error of the line"
confidence = "measured from 3.7 V up, inside the meter's 0.1 % class"

[[constant]]
label = "Terminal difference offset"
experiment = "terminal-chain"
key = "terminal_offset_counts"
decimals = 1
signed = true
bounds = "statistical, one standard error of the line"
confidence = "measured"

[[constant]]
label = "Rail tap scale at rest"
experiment = "terminal-chain"
key = "rail_counts_per_v"
decimals = 2
bounds = "statistical, one standard error of the fine-grid line"
confidence = "measured at rest, under a lap the tap reads 0.9 to 1.4 % low"

[[constant]]
label = "Rail tap offset at rest"
experiment = "terminal-chain"
key = "rail_offset_counts"
decimals = 1
signed = true
bounds = "statistical, one standard error of the fine-grid line"
confidence = "good to about a count, it moves with the join"

[[constant]]
label = "Rail range graded"
experiment = "terminal-chain"
key = "rail_range_v"
decimals = 3
bounds = "range, lowest to highest meter reading"
confidence = "nothing under the low end is graded"

[[constant]]
label = "Rail sag per amp, dev board"
experiment = "terminal-chain"
key = "rail_sag_v_per_a"
decimals = 3
bounds = "statistical, one standard error of the line"
confidence = "measured at the connector, the feed diode and the DPS leads"

[[constant]]
label = "Terminal difference at a 3.3 V rail over the meter"
experiment = "terminal-chain"
key = "terminal_error_3v3_pct"
decimals = 1
signed = true
confidence = "not graded, one level with the reference in dropout, no spread"

[[constant]]
label = "VDD at a 3.3 V rail, at rest"
experiment = "terminal-chain"
key = "vdd_3v3_v"
decimals = 2
confidence = "read from the chip's 1.2 V reference, one level, no spread"

[[constant]]
label = "VDD at a 3.3 V rail, under the lap"
experiment = "terminal-chain"
key = "vdd_3v3_under_lap_v"
decimals = 2
confidence = "about, by the rail tap's route, one level, no spread"

[[constant]]
label = "Shunt ON edge lag, slow decay, 7.4 V"
