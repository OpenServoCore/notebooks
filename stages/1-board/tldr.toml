key = "vdd_onset_dip_mv.3v7"
decimals = 1
bounds = "statistical, one standard error over the 11 onsets"
confidence = "high, read from vref_raw, over half its peak for 0.5 ms, +20 counts on pos"

[[constant]]
label = "VDD ripple at the TEL frame"
