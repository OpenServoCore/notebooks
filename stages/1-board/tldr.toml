key = "pos_sd_drive_range_counts"
unit = "counts rms"
scale = 1.0
decimals = 2
bounds = "range, lowest to highest of the 432 rungs"
confidence = "measured on both captures, 0.66 at rest, 1.0 with the pattern in"

[[constant]]
label = "Awake zero over the asleep zero, 3.7 V"
