confidence = "measured, the 3.7 V laps"

[[constant]]
label = "Window scale k on the resistor"
experiment = "bridge-states"
key = "window_scale"
decimals = 4
bounds = "range, lowest to highest of the twenty bursts"
confidence = "a ratio inside one capture, over the burst's own zero, inside sample-timing's range"

[[constant]]
label = "L by the period fit, inductor A at 25 %"
experiment = "bridge-states"
key = "l_fit_mh.ra_25"
decimals = 3
bounds = "range, the bursts after the first of each set"
confidence = "measured, no outside reference for the part"

[[constant]]
label = "L by the fast-decay ramp, inductor A at 25 %"
experiment = "bridge-states"
key = "l_fast_ramp_mh.ra_25"
decimals = 3
bounds = "range, the bursts after the first of each set"
confidence = "measured, within 4 % of the fit"

[[constant]]
label = "Ripple L over the fit, inductor A at 25 %"
experiment = "bridge-states"
key = "ripple_over_fit.ra_25"
decimals = 2
confidence = "the method's own gap, high confidence, a ratio of medians with no bounds"

[[constant]]
label = "Ripple L over the fit, inductor A at 40 %"
experiment = "bridge-states"
key = "ripple_over_fit.ra_40"
decimals = 2
confidence = "the method's own gap, high confidence, a ratio of medians with no bounds"

[[constant]]
label = "First burst after a sign change, L jump, slow decay"
experiment = "bridge-states"
key = "first_burst_l_jump_pct.slow"
decimals = 1
signed = true
bounds = "range, lowest to highest of the twelve sets"
confidence = "moderate confidence, the cores' history or the set boundary is open"

[[constant]]
label = "First burst after a sign change, L jump, fast decay"
experiment = "bridge-states"
key = "first_burst_l_jump_pct.fast"
decimals = 1
signed = true
bounds = "range, lowest to highest of the sets"
confidence = "measured, within the other bursts' scatter"

[[constant]]
label = "First burst after a sign change, leftover volt-seconds"
experiment = "bridge-states"
key = "first_burst_leftover_uvs"
decimals = 0
bounds = "range, lowest to highest of the first bursts"
confidence = "measured"

[[constant]]
label = "Pos shift per amp of load current, DC"
experiment = "pos-coupling"
key = "pos_dc_coupling_counts_per_a"
decimals = 2
signed = true
bounds = "statistical, one standard error of the line over both captures"
confidence = "high, the same sign both directions, a rung mean carries about 0.1 count run to run"

[[constant]]
label = "Pos shift at partial duty, the largest group"
experiment = "pos-coupling"
key = "pos_partial_duty_max_counts"
decimals = 2
signed = true
bounds = "statistical, one standard error over 3 repeats x 2 directions"
confidence = "a bound, fast decay 60 % at 7.4 V, repeats across captures to 0.03 counts, mechanism open"

[[constant]]
label = "VDD dip at a 100 % onset, 3.7 V"
