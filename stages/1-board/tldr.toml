key = "on_edge_lag_7v4"
decimals = 0
bounds = "range, lowest to highest of the 24 bursts"
confidence = "measured, the median, half-plateau crossing"

[[constant]]
label = "Shunt ON edge lag, slow decay, 3.7 V"
