key = "off_edge_lag_7v4"
decimals = 0
bounds = "range, lowest to highest of the 24 bursts"
confidence = "measured, the median"

[[constant]]
label = "OFF edge lag, slow decay, 3.7 V"
experiment = "sample-timing"
key = "off_edge_lag_3v7"
decimals = 0
bounds = "range, lowest to highest of the 24 bursts"
confidence = "measured, the median"

[[constant]]
label = "Shunt settle to 1 %, from the commanded start, 7.4 V"
experiment = "sample-timing"
key = "shunt_settle_7v4"
decimals = 0
bounds = "range, lowest to highest of the 24 bursts"
confidence = "measured, the median"

[[constant]]
label = "Shunt settle to 1 %, from the commanded start, 3.7 V"
experiment = "sample-timing"
key = "shunt_settle_3v7"
decimals = 0
bounds = "range, lowest to highest of the 24 bursts"
confidence = "measured, the median"

[[constant]]
label = "Window scale k, slow decay"
experiment = "sample-timing"
key = "window_scale"
decimals = 4
bounds = "range, the two rails"
confidence = "a ratio inside one capture, the rails' split not resolved"

[[constant]]
label = "NTC beta, the design conversion"
experiment = "ntc-curve"
key = "beta_nominal"
decimals = 0
confidence = "the part's nominal, so no bounds, within 0.2 C of the thermocouple once the rig is out"

[[constant]]
label = "Current gain drift with board temperature"
experiment = "opamp-temperature"
key = "gain_drift_pct_per_c"
decimals = 4
signed = true
bounds = "statistical, one standard error of the line"
confidence = "high confidence it is the temperature's, a bound more than a correction"

[[constant]]
label = "Bridge ON edge lag, fast decay"
experiment = "bridge-states"
key = "fast_edge_lags_ticks.on"
unit = "ticks"
scale = 1.0
decimals = 0
confidence = "least misfit of a 2-tick scan, known to about 4 ticks, no bounds in the file"

[[constant]]
label = "Bridge OFF edge lag, fast decay"
experiment = "bridge-states"
key = "fast_edge_lags_ticks.off"
unit = "ticks"
scale = 1.0
decimals = 0
confidence = "least misfit of a 2-tick scan, known to about 2 ticks, no bounds in the file"

[[constant]]
label = "Shunt amplifier lag"
experiment = "bridge-states"
key = "amp_tau_ticks"
decimals = 1
confidence = "fitted at the scan's minimum, no bounds in the file"

[[constant]]
label = "Shunt amplifier gain"
experiment = "bridge-states"
key = "amp_gain"
decimals = 4
confidence = "fitted at the scan's minimum, no bounds in the file"

[[constant]]
label = "DC resistance, bare resistor"
experiment = "bridge-states"
key = "dc_r_ohm.r"
decimals = 4
bounds = "range, the laps but 4.2 V"
confidence = "measured, the 3.7 V laps"

[[constant]]
label = "DC resistance, resistor and inductor A"
experiment = "bridge-states"
key = "dc_r_ohm.ra"
decimals = 4
