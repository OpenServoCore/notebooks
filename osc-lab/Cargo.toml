[workspace]
resolver = "2"

[package]
name        = "osc-lab"
version     = "0.1.0"
edition     = "2024"
description = "The raw capture instrument the notebooks record with: open-loop duty sweeps and high-rate shunt bursts, no fit."
license     = "MIT OR Apache-2.0"

# One rev for every firmware crate, so the client, the protocol and the
# servo core resolve to the same checkout.
[dependencies]
anyhow         = "1"
clap           = { version = "4", features = ["derive"] }
control-table  = { git = "https://github.com/OpenServoCore/open-servo-core", rev = "faed1ede837177fb9c01a059561ffc13e792051e" }
ctrlc          = "3"
osc-client     = { git = "https://github.com/OpenServoCore/open-servo-core", rev = "faed1ede837177fb9c01a059561ffc13e792051e" }
osc-protocol   = { git = "https://github.com/OpenServoCore/open-servo-core", rev = "faed1ede837177fb9c01a059561ffc13e792051e" }
osc-servo-core = { git = "https://github.com/OpenServoCore/open-servo-core", rev = "faed1ede837177fb9c01a059561ffc13e792051e" }
serde_json     = "1"

[dev-dependencies]
osc-client = { git = "https://github.com/OpenServoCore/open-servo-core", rev = "faed1ede837177fb9c01a059561ffc13e792051e", features = ["fake-adapter"] }
